
name: Deploy C Manual Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bmake \
            mandoc \
            python3-pygments \
            man-db \
            gcc

      - name: Build compatible lowdown
        run: |
          git clone --depth 1 \
            --branch VERSION_3_1_1 \
            https://github.com/kristapsdz/lowdown.git \
            "$RUNNER_TEMP/lowdown"

          cd "$RUNNER_TEMP/lowdown"
          ./configure
          bmake -j2

          test -x ./lowdown
          echo "$RUNNER_TEMP/lowdown" >> "$GITHUB_PATH"

      - name: Check build environment
        run: make doctor

      - name: Run tests
        run: make test

      - name: Validate manual pages
        run: make check

      - name: Generate HTML documentation
        run: make html

      - name: Verify website entry point
        run: test -s build/html/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
